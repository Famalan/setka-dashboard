<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Сетка — Мой дашборд</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="js/state.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/drag.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="wrap nav">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>Сетка
        </div>
        <a class="board-link" href="#widgets-title">Мои виджеты</a>
        <button id="theme" class="theme"></button>
      </div>
    </header>
    <main>
      <section class="hero" aria-labelledby="board-title">
        <div class="wrap hero-inner">
          <div class="hero-copy">
            <p class="eyebrow">Личное пространство</p>
            <h1 id="board-title">Мой дашборд</h1>
            <p class="intro">Заметки, задачи и цифры в одном месте.</p>
          </div>
          <img
            class="orbit"
            src="assets/orbit.svg"
            alt=""
            width="560"
            height="340"
          />
        </div>
      </section>
      <section class="wrap workspace" aria-labelledby="widgets-title">
        <div class="toolbar">
          <div class="section-title">
            <h2 id="widgets-title">Мои виджеты</h2>
            <output id="count" aria-label="Количество виджетов"></output>
          </div>
          <div class="actions">
            <button id="reset"></button
            ><button id="add" class="primary"></button>
          </div>
        </div>
        <div id="grid"></div>
      </section>
    </main>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button id="close" aria-label="Закрыть">×</button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" role="status"></div>
  </body>
</html>
